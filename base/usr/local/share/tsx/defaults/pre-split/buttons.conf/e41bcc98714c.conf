# /etc/tsx/buttons.conf: settings and actions for the front keys (tsx-buttons)
# This file is a template. It defines no keys. After you edit it, run
# "rc-service tsx-buttons reload" (or "tsx-keypad reload").
#
# The keys of the panel come from the board layer /etc/tsx/buttons-board.conf.
# tsx-buttons reads the board layer first and this file after it. A setting
# in this file replaces the same setting of the board layer. A `button` line
# with the name of a board key replaces that key. A panel with no board layer
# has no keys until you add `button` lines here.
#
# Without any `on` line, a key press only fires the Home Assistant event
# (HA_EVENT below) and writes the "last" line of /run/tsx/buttons.state. A press
# on a blank screen only wakes the screen. tsx-idled then grabs the input.
#
# Lines:
#   SETTING=value
#   button NAME KEYCODE [led=N]            define a key (name it as you like).
#                                          KEYCODE is a name such as KEY_F13 or a number.
#                                          led=N is the number of its key LED (1 to 16)
#   on NAME short|long|hold ACTION ARGS     bind an action (several lines = all run)
#       short = released before LONG_PRESS_MS, long = held LONG_PRESS_MS (once),
#       hold  = like long, then again every HOLD_REPEAT_MS while held
#
# Actions:
#   exec SHELL-COMMAND           /bin/sh -c as root. Env TSX_BUTTON, TSX_PRESS
#   ha DOMAIN.SERVICE [JSON]     POST $HA_URL/api/services/DOMAIN/SERVICE
#   ha-post /api/PATH [JSON]     POST any HA REST endpoint
#   navigate URL|/path           open in the kiosk (a /path is relative to KIOSK_URL)
#   home                         open KIOSK_URL (the default dashboard)
#   reload                       reload the page
#   blank on|off|toggle          screen off/on through tsx-idled
#   brightness +N|-N|N|auto      backlight steps (cap BACKLIGHT_MAX of kiosk.conf).
#                                +N/-N: the local manual setting, an offset on top
#                                of the ambient light sensor / schedule (kept until
#                                "auto" or a reboot). N: a fixed level until the next
#                                day/night change. auto: both off.
#   led +N|-N|N|on|off|toggle|auto   key LED level override (auto = schedule,
#                                see "Key LEDs" at the end of this file)
#   overlay full|slider|hide|toggle  the quick-settings overlay (brightness slider,
#                                auto brightness, screen off, reload page. Sway
#                                session only, else OVERLAY_FALLBACK runs)
#   none
#
# Examples. Remove the "#" to use one. The keys "power" and "lights" must
# exist (in the board layer or in a `button` line of this file).
#   on power  long  overlay full
#   on power  short blank toggle
#   on lights short ha light.toggle {"entity_id": "light.CHANGE_ME"}
#   on lights long  navigate /lovelace/lights
#   on lights long  exec tsx-voice ptt
#   on up     short brightness +2
#   on up     hold  brightness +1
# Every press also fires the HA event below, so HA automations can do more.
# "tsx-voice ptt" is push-to-talk for the Assist voice satellite (WAKE=ptt in
# /etc/tsx/voice.conf). This line toggles a blue LED bar (R G B 0..100):
#   on lights long exec [ "$(tsx-ledbar get | sed -n 's/^want //p')" = "0 0 0" ] && tsx-ledbar set 0 0 60 || tsx-ledbar off
#
# Navigation uses the Chromium DevTools on DEVTOOLS. This needs
# KIOSK_DEVTOOLS=1 in /etc/kiosk.conf, and it listens on 127.0.0.1 only.
# It navigates inside the HA frontend, with no page load. Without DevTools,
# NAV_FALLBACK=restart restarts the kiosk on the new URL (slow, ~15 s).
# NAV_FALLBACK=none does nothing.

# timings (ms)
LONG_PRESS_MS=700
HOLD_REPEAT_MS=300

# Hardware settings. The board layer sets them. Set one here only to replace
# the value of the board.
#   LED_PWM=NAME          the LED class device with the brightness of all key LEDs
#   LED_KEY_PREFIX=NAME   the enable LEDs are NAME1, NAME2, ... (one for each led=N)
#
# Slide a finger along the key strip (the keys with led=N, in the order of N).
# This raises the brightness (toward the key with the lowest N) or lowers it.
# Each key passed changes it by SLIDE_STEP backlight steps, as an offset on the
# ambient light level. The slider of the overlay shows while you slide.
# The keys report only press and release. So a slide is "the next key
# pressed within SLIDE_GAP_MS of the last release". For that reason, a short
# press of a strip key fires SLIDE_GAP_MS after its release. SLIDE_STEP=0 (the
# default) turns the slide off. A short press then fires at once.
#   SLIDE_STEP=2
SLIDE_GAP_MS=250
# "overlay" action without an overlay (cage session, KIOSK_OVERLAY=off)
OVERLAY_FALLBACK=blank toggle
# The LED of the pressed key goes dark for this long as feedback (0 = off)
PRESS_FEEDBACK_MS=120

# Home Assistant. Empty HA_URL = the origin of KIOSK_URL. The service reads
# it from KIOSK_CONF (default /etc/kiosk.conf), then from the panel.conf
# override /run/tsx/kiosk.conf if it exists.
# Token: HA profile -> Security -> Long-lived access token. Put it in one
# line in HA_TOKEN_FILE, chmod 600. Without it, the service skips all HA actions.
HA_URL=
HA_TOKEN_FILE=/etc/tsx/ha-token
HA_TIMEOUT=10
# Fire this HA event on every short/long press (empty = off):
#   event_type tsx_button, data {panel, button, press: short|long, code}
# The ESPHome device also has an event entity for each key.
HA_EVENT=tsx_button

# Kiosk navigation
DEVTOOLS=127.0.0.1:9222
# none: a home or navigate press never restarts the kiosk (repeated presses
# caused overlapping restarts). Navigation needs KIOSK_DEVTOOLS=1 in kiosk.conf.
NAV_FALLBACK=none

# Key LEDs (0..255): awake by day / by night, and while the screen is blank.
# They have an effect only on a panel with key LEDs (a key with led=N).
# Night hours: LED_NIGHT_START/LED_NIGHT_END, default NIGHT_START/NIGHT_END of kiosk.conf.
# An override ("led" action, "tsx-keypad led", the Home Assistant "Key LEDs"
# light) applies at once. It holds across blank, wake and the day/night change
# until "led auto":
#   led off   the keys stay dark, also while the screen is blank
#   led N     N replaces LED_DAY and LED_NIGHT. While the screen is blank, the
#             keys show LED_BLANK.
LED_DAY=128
LED_NIGHT=24
# LED_BLANK (the screen-off level) > 0 keeps the keys visible while the screen
# is blank. KEY_LED_BLANK in panel.conf replaces it (tsx-config apply writes
# /run/tsx/buttons.conf, and tsx-buttons reads it after this file). The Home
# Assistant number "Key LEDs screen-off level" sets KEY_LED_BLANK.
LED_BLANK=24

# /etc/tsx/setup.conf: on-panel first-boot setup page (tsx-setupd,
# see the "Setup page" docs of the board repository). tsx-setupd reads all of
# it. kiosk-session
# reads only TSX_SETUP_PORT, to build the local URL that it loads while the
# panel is unconfigured. After editing: rc-service tsx-setupd restart.

# Port that tsx-setupd listens on for localhost. The kiosk itself always uses
# this port. 8080 needs no special privilege, unlike port 80.
TSX_SETUP_PORT=8080

# LAN access from a laptop or phone (http://<panel-ip>:<TSX_SETUP_PORT>/setup,
# the same port -- see the "Setup page" docs of the board repository).
# on  = allowed with "Log in with Home Assistant" (see TSX_SETUP_HA_LOGIN),
#       and with the pairing code shown on the panel while the panel is
#       unconfigured or a Setup window is open.
# off = no LAN access at all, also while unconfigured. Localhost (the kiosk
#       itself) is not affected.
TSX_SETUP_LAN=on

# "Log in with Home Assistant" (docs/setup.md of tsx-linux-common): an
# administrator of the Home Assistant of this panel (panel.conf HA_URL, else
# the origin of KIOSK_URL) opens the page from the LAN at any time, with no
# pairing code.
# on  = the page is always on the LAN when the panel knows that URL
# off = only the pairing code, as before
TSX_SETUP_HA_LOGIN=on

# A login session ends this many seconds after the login (TSX_SETUP_SESSION)
# or after the last request (TSX_SETUP_IDLE). A logout, a revoke on the page
# and a restart of tsx-setupd end it at once.
TSX_SETUP_SESSION=28800
TSX_SETUP_IDLE=3600

# How long a pairing code (shown on the screen of the panel) and the paired
# session of a LAN client each stay valid, in seconds. This is also how long
# `tsx-config setup` and the overlay "Setup" entry keep the local setup page
# on screen when the panel is already configured.
TSX_SETUP_WINDOW=900

# Does this panel run the browser kiosk (the package tsx-kiosk)?
# auto = yes when /etc/kiosk.conf exists. This is the default.
# on / off = set the mode by hand.
# With off, a native panel app owns the screen. The page then has no page URL
# and no blank timeout. A panel is configured when panel.conf has a key. And
# tsx-setupd writes the pairing code to /run/tsx-setup/screen.json for the
# native app, while the LAN window is open.
TSX_SETUP_KIOSK=auto

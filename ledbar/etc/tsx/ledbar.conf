# /etc/tsx/ledbar.conf: settings of the USB RGB LED bar (tsx-ledbar)
# After editing: rc-service tsx-ledbar restart
#
# Colors are R G B, each 0..100 (percent), e.g. "0 0 20" or "0,0,20".

# Color set at boot (0 0 0 = off)
BOOT_COLOR="0 0 0"

# The screen state never changes the bar. Old files may have BLANK and
# BLANK_DIM. The service ignores both keys and logs one line.

# Effects need the LED bar firmware TSX-LEDBAR (tsx-ledbar fw). The stock
# firmware ignores these keys. Empty = the firmware default.
#   FX_SMOOTH = ms to ramp each new color (0..60000, default 0 = at once)
#   FX_CAP    = power cap of the three colors in percent of one full
#               color (10..150, default 110)
FX_SMOOTH=
FX_CAP=

# LED map. It needs the LED bar firmware TSX-LEDBAR 0.1.5 or later. A LED
# map gives the position of each LED on the bar. The bar cannot tell its
# model, so the service sends the map after each plug-in and each start of
# the bar. Empty = the map that the board file gives for this panel. When the
# board gives no map, the service sends "LEDMAP DEFAULT": the firmware default
# map. Or one of these names:
#   TSW-1060-LB = the map of the TSW-1060-LB bar
#   outputs     = LED n on output n, to find the map of a new bar
#   default     = the firmware default map (TSW-1060-LB)
# To see the map in use: tsx-ledbar console LEDMAP
LEDMAP=

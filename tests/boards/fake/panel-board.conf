# /etc/tsx/panel-board.conf of the made-up test board "fake" (shell syntax).
# It is the board layer of kiosk.conf. The values differ from the values of
# the real families on purpose.

# GPU mode: GLES in the compositor, software rendering in the browser.
KIOSK_GPU=compositor

# A narrow backlight: levels 2 to 15.
BACKLIGHT_MAX=15
BACKLIGHT_MIN=2
BRIGHTNESS_DAY=11
BRIGHTNESS_NIGHT=6

# CPU governor (follows the screen state of tsx-idled).
CPUFREQ_AWAKE=ondemand
CPUFREQ_BLANK=powersave

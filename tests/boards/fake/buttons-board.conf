# /etc/tsx/buttons-board.conf of the made-up test board "fake": the key layer
# of the board. It has seven keys and seven key LEDs. The names and the key
# codes differ from the keys of the real families on purpose.

LED_PWM=fake:keys
LED_KEY_PREFIX=fake:key
SLIDE_STEP=0

button prog1 KEY_PROG1 led=1
button prog2 KEY_PROG2 led=2
button prog3 KEY_PROG3 led=3
button prog4 KEY_PROG4 led=4
button extra1 KEY_F18 led=5
button extra2 KEY_F19 led=6
button extra3 KEY_F20 led=7

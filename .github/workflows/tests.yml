name: tests
on:
  push:
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install busybox
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends busybox
      - name: ci/lint.sh
        run: ci/lint.sh

  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the tools of the tests
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gcc busybox jq libmpv2 python3-venv
      - name: tests/run-all.sh --c --net
        run: tests/run-all.sh --c --net

name: tests
on:
  push:
  pull_request:

jobs:
  lint:
    name: lint
    # An arm64 runner. busybox exists for arm64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: install busybox
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends busybox
      - name: ci/lint.sh
        run: ci/lint.sh
      - name: ci/check-generic.sh
        run: ci/check-generic.sh

  host-tests:
    name: host tests
    # An arm64 runner. gcc, busybox, jq, libmpv2 and python3-venv all exist for
    # arm64. The C tests build and run natively on it. The tests of the
    # ESPHome shim install only wheels (pip --only-binary), and the wheels
    # that they need exist for aarch64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: install the tools of the tests
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gcc busybox jq libmpv2 python3-venv
      - name: tests/run-all.sh --c --net
        run: tests/run-all.sh --c --net

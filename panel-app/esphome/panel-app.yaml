# panel-app.yaml: the generic part of the panel app, an ESPHome package.
# See docs/panel-app.md. A board YAML includes it:
#
#   packages:
#     panel_app: !include tsx-panel-app/panel-app.yaml
#   external_components:
#     - source: {type: local, path: tsx-panel-app/components}
#       components: [tsx_cards, tsx_runtime]
#
# The board YAML gives:
#   - esphome: name and friendly_name (the defaults: the service sets the
#     names of the panel at run time), and the platform (for example host:)
#   - a display with the id panel_display and a touchscreen with the id
#     panel_touch
#   - the keys of the panel: each key calls id(panel_cards).key_state("NAME", x)
#     at each change (a press on a dark screen only wakes it)
#   - optional: tsx_cards input_id (the five-finger tap), panel_lights,
#     key_events and on_screen (the display output off and on)
# The program has no per-panel value: tsx_runtime reads the names and the
# API encryption key at start, and patches/host-mac.patch the MAC.

logger:
  level: INFO

api:
  # The default (15 min) ends the process when no client is connected.
  reboot_timeout: 0s
  encryption:
    # A placeholder, not a secret. It makes ESPHome build the encrypted API
    # with no plaintext fallback. tsx_runtime replaces it at start with the
    # key of the panel (/run/tsx/esphome.key).
    key: "dHN4LXBhbmVsLWFwcCBydW4tdGltZSBrZXkgc2xvdCE="
  # The layout as Home Assistant actions (docs/panel-app.md, "Layout from
  # Home Assistant"): esphome.<device>_set_layout and esphome.<device>_get_layout.
  actions:
    # layout: the JSON text of a layout file. The app checks it with its own
    # rules and answers at once. Then tsx-layout-check checks it again and
    # installs it atomically, and the app shows the new layout.
    - action: set_layout
      supports_response: status
      variables:
        layout: string
      then:
        - api.respond:
            success: !lambda return id(panel_cards).set_layout_json(layout);
            error_message: !lambda return id(panel_cards).layout_set_error();
    # The layout in use: the parsed layout, its SHA-256, its file and the
    # result of the last set_layout.
    - action: get_layout
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              JsonDocument doc;
              if (deserializeJson(doc, id(panel_cards).layout_text()) == DeserializationError::Ok)
                root["layout"].set(doc.as<JsonVariantConst>());
              root["hash"] = id(panel_cards).layout_hash();
              root["source"] = id(panel_cards).layout_source();
              root["status"] = id(panel_cards).layout_status();

tsx_runtime:
  key_file: /run/tsx/esphome.key

time:
  - platform: homeassistant
    id: ha_time

font:
  # Material Design Icons (Pictogrammers, Apache License 2.0), downloaded at
  # build time. The font holds only the glyphs of icon-glyphs.yaml.
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: tsx_icon_font
    size: 36
    bpp: 4
    glyphs: !include icon-glyphs.yaml

lvgl:
  displays: [panel_display]
  touchscreens: [panel_touch]
  buffer_size: 100%
  log_level: WARN
  # The default is big_endian when a display gives no byte order (the sdl
  # display gives none). Then LVGL swaps the bytes of each flushed area, and
  # the sdl display draws the area one pixel at a time. little_endian is the
  # native order of the RGB565 texture: no swap, one texture update per area.
  byte_order: little_endian
  # tsx_cards makes all objects at run time. An empty list stops ESPHome
  # from adding its demo page (an animated spinner under the cards).
  widgets: []

tsx_cards:
  id: panel_cards
  time_id: ha_time
  fonts:
    small: montserrat_16
    label: montserrat_20
    value: montserrat_28
    clock: montserrat_48
    icon: tsx_icon_font

# The screen as Home Assistant entities, the same names as on the kiosk
# panels. Home Assistant can change them: the setting "Allow the device to
# perform Home Assistant actions" is only for actions that the app sends.
switch:
  - platform: template
    name: Screen
    id: panel_screen
    icon: mdi:monitor
    # No action at the start: the screen starts on.
    restore_mode: DISABLED
    lambda: return id(panel_cards).screen_is_on();
    turn_on_action:
      - lambda: id(panel_cards).wake("Home Assistant");
    turn_off_action:
      - lambda: id(panel_cards).screen_off("Home Assistant");
  # Updates (docs/panel-app.md, "Updates"): the automatic restart after an
  # install. The setting goes through tsx-panelctl (root) to panel.conf
  # (UPDATE_AUTO_RESTART).
  - platform: template
    name: Automatic restart
    id: panel_auto_restart
    icon: mdi:restart
    entity_category: config
    restore_mode: DISABLED
    lambda: |-
      int on = id(panel_cards).auto_restart();
      if (on < 0)
        return {};
      return on == 1;
    turn_on_action:
      - lambda: id(panel_cards).set_auto_restart(true);
    turn_off_action:
      - lambda: id(panel_cards).set_auto_restart(false);

number:
  - platform: template
    name: Backlight
    id: panel_backlight
    icon: mdi:brightness-6
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    update_interval: 1s
    # The polls publish a change only (tsx_cards::if_changed).
    lambda: return tsx_cards::if_changed(id(panel_backlight), id(panel_cards).backlight());
    set_action:
      - lambda: id(panel_cards).set_backlight(x);
  # The volume of the panel speaker (docs/panel-app.md, "Volume"): the player
  # volume while the Sendspin player runs (a change in Music Assistant shows
  # here within a second), else the "Master" control of the sound card.
  # Unknown on a panel with no sound card.
  - platform: template
    name: Volume
    id: panel_volume
    icon: mdi:volume-high
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    update_interval: 1s
    lambda: return tsx_cards::if_changed(id(panel_volume), id(panel_cards).volume());
    set_action:
      - lambda: id(panel_cards).set_volume(x);
  - platform: template
    name: Blank timeout
    id: panel_blank_timeout
    icon: mdi:timer-outline
    entity_category: config
    mode: box
    min_value: 0
    max_value: 86400
    step: 10
    unit_of_measurement: s
    update_interval: 5s
    lambda: return tsx_cards::if_changed(id(panel_blank_timeout), id(panel_cards).blank_timeout());
    set_action:
      - lambda: id(panel_cards).set_blank_timeout(x);
  - platform: template
    name: Dim timeout
    id: panel_dim_timeout
    icon: mdi:timer-outline
    entity_category: config
    mode: box
    min_value: 0
    max_value: 86400
    step: 5
    unit_of_measurement: s
    update_interval: 5s
    lambda: return tsx_cards::if_changed(id(panel_dim_timeout), id(panel_cards).dim_timeout());
    set_action:
      - lambda: id(panel_cards).set_dim_timeout(x);
  - platform: template
    name: Dim level
    id: panel_dim_level
    icon: mdi:brightness-4
    entity_category: config
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    update_interval: 5s
    lambda: return tsx_cards::if_changed(id(panel_dim_level), id(panel_cards).dim_level());
    set_action:
      - lambda: id(panel_cards).set_dim_level(x);

text_sensor:
  # The SHA-256 of the layout file in use (sha256sum of the file gives the
  # same text). An automation can compare it after set_layout.
  - platform: template
    name: Layout hash
    id: panel_layout_hash
    icon: mdi:view-dashboard-edit-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: return tsx_cards::text_if_changed(id(panel_layout_hash), id(panel_cards).layout_hash());
  # The time of the last boot (docs/panel-app.md, "Last boot"). It changes at a
  # reboot, and once when NTP steps the clock. It sends a state on a change only.
  - platform: template
    name: Last boot
    id: panel_last_boot
    icon: mdi:restart
    entity_category: diagnostic
    device_class: timestamp
    update_interval: 30s
    lambda: return tsx_cards::text_if_changed(id(panel_last_boot), id(panel_cards).last_boot());

# Updates (docs/panel-app.md, "Updates"). The state is the file
# /run/tsx/update.state of tsx-autoupdate. Every action goes through the
# FIFO of tsx-panelctl: the app never runs as root.
update:
  # ESPHome has no template update platform: tsx_cards/update.py.
  - platform: tsx_cards
    name: Update
    id: panel_update
    icon: mdi:package-up
    device_class: firmware
    # No category, as on the kiosk panels: the entity shows with the controls.
    entity_category: ""

binary_sensor:
  - platform: template
    name: Restart required
    id: panel_restart_required
    icon: mdi:restart-alert
    lambda: |-
      int r = id(panel_cards).restart_required();
      if (r < 0)
        return {};
      return r == 1;

button:
  - platform: template
    name: Restart
    id: panel_restart
    icon: mdi:restart
    device_class: restart
    on_press:
      - lambda: id(panel_cards).restart();

select:
  - platform: template
    name: Update mode
    id: panel_update_mode
    icon: mdi:update
    entity_category: config
    options:
      - auto
      - manual
    update_interval: 1s
    lambda: |-
      std::string m = id(panel_cards).update_mode();
      if (m.empty())
        return {};
      return tsx_cards::option_if_changed(id(panel_update_mode), m);
    set_action:
      - lambda: id(panel_cards).set_update_mode(x.c_str());

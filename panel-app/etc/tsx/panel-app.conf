# /etc/tsx/panel-app.conf: settings of the panel app service (shell syntax).
# tsx-panel-app-run reads this file, then /etc/tsx/panel-app-board.conf (the
# board package), then /var/lib/tsx/panel-app.conf (this panel). A later file
# wins. After a change: rc-service tsx-panel-app restart.

# The program (the board package installs it).
PANEL_APP_BIN=/usr/local/bin/tsx-panel-app
# The ESPHome preferences. /var/lib/tsx keeps its contents after an image
# update.
PANEL_APP_PREFDIR=/var/lib/tsx/panel-app
# The network interface whose MAC gives the device MAC (see below).
PANEL_APP_NET_IF=eth0
# Device files that the program needs. The service waits up to
# PANEL_APP_WAIT seconds for them (the board sets them).
PANEL_APP_DEVICES=
PANEL_APP_WAIT=60
# NAME=value words for the environment of the program (the board sets them).
PANEL_APP_ENV=
# Folders that the service makes (mode 700) before the start, for example
# XDG_RUNTIME_DIR of PANEL_APP_ENV.
PANEL_APP_DIRS=

# The identity of the device in Home Assistant. Leave them empty here. The
# first start writes the values of this panel to /var/lib/tsx/panel-app.conf
# and keeps them, so Home Assistant always finds the same device:
#   NAME           ESPHome device name (a-z, 0-9, '-', at most 31): the host
#                  name in lowercase
#   FRIENDLY_NAME  the name that Home Assistant shows: the host name
#   MAC            the MAC of PANEL_APP_NET_IF with the locally administered
#                  bit set (the unique id in Home Assistant)
NAME=
FRIENDLY_NAME=
MAC=

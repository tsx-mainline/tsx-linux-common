# /etc/tsx/esphome.conf: standalone ESPHome native API server for the panel
# entities (tsx-esphome), used when VOICE=off -- see docs/ha.md "One Home
# Assistant device". After editing: rc-service tsx-esphome restart.
#
# When VOICE=on the voice satellite (tsx-voice) serves these same entities
# itself instead, so Home Assistant only ever discovers one device; this
# daemon then stays enabled but idle (tsx-config apply stops it). Both are
# controlled from the panel config's HA_TRANSPORT/VOICE keys (tsx-config,
# panel.conf) -- do not edit that choice here.

# Name shown in Home Assistant (default: <hostname>).
NAME=
PORT=6053

# Network interface / address (empty = default route, like tsx-voice.conf).
IFACE=
HOST=

# Extra arguments for tsx_panel.esphome_server (e.g. --poll-interval 0.5).
ARGS=

# /etc/tsx/autoupdate.conf: automatic Alpine package updates (tsx-autoupdate)
# tsx-autoupdate reads this file at each run. No restart of the service is
# needed after a change.
#
# The v3.24 branch of Alpine has no separate security channel. Every `apk
# upgrade` on a stable branch IS the security and bug-fix channel. Both modes
# check for updates every 15 minutes. After an install, the panel needs a
# restart when the upgrade changed the kernel, musl, openrc, busybox, the init
# system, or a tsx-* package (the running services keep the old code until
# they start again).
#
# The Home Assistant entities "Update mode" and "Automatic restart" and the
# setup page save UPDATE_MODE and UPDATE_AUTO_RESTART in panel.conf. Those
# values win over MODE and AUTO_RESTART of this file.

# auto   = install inside the window below while the screen is idle.
# manual = never install by itself. Home Assistant shows the update, and its
#          Install button (or `tsx-autoupdate now`) installs at once.
MODE=auto

# Local time window in which an automatic install can run, HH:MM-HH:MM. It can
# cross midnight (for example 23:30-01:30).
WINDOW=03:00-05:00

# on  = restart the panel right after an install that needs a restart. An
#       automatic install restarts inside the window. An install from Home
#       Assistant restarts at once, also outside the window.
# off = do not restart. Home Assistant shows "Restart required" until a person
#       restarts the panel (its Restart button, or Install on the same entry).
AUTO_RESTART=on

# The older keys ENABLED=0 (same as MODE=manual) and REBOOT=never (same as
# AUTO_RESTART=off) still work when MODE and AUTO_RESTART are not set.
